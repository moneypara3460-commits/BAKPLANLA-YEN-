# Isolated development only; not a snapshot of production settings.
# Confirm the remote database major version before creating a reviewed baseline.
project_id = "bakplanla-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

# Mirrors the captured deployed settings; handler authentication varies and must be verified per function.
[functions.smart-endpoint]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.isletme-basvuru]
verify_jwt = false

[functions.isletme-karar]
verify_jwt = false

[functions.isbasi]
verify_jwt = false

[functions.shopping-reminder]
verify_jwt = false

# Internal rights tooling: gateway JWT plus an application-side Auth lookup and
# private operator/case authorization. No client app invokes this function.
[functions.privacy-operator]
verify_jwt = true
